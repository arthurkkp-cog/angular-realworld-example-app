<div class="editor-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-10 offset-md-1 col-xs-12">
        <app-list-errors errors="errors"></app-list-errors>

        <form name="articleForm">
          <fieldset ng-disabled="isSubmitting">
            <fieldset class="form-group">
              <input
                class="form-control form-control-lg"
                ng-model="formData.title"
                type="text"
                placeholder="Article Title"
              />
            </fieldset>

            <fieldset class="form-group">
              <input
                class="form-control"
                ng-model="formData.description"
                type="text"
                placeholder="What's this article about?"
              />
            </fieldset>

            <fieldset class="form-group">
              <textarea
                class="form-control"
                ng-model="formData.body"
                rows="8"
                placeholder="Write your article (in markdown)"
              ></textarea>
            </fieldset>

            <fieldset class="form-group">
              <input
                class="form-control"
                type="text"
                placeholder="Enter tags"
                ng-model="tagField"
                ng-keypress="$event.keyCode === 13 && addTag()"
              />
              <div class="tag-list">
                <span ng-repeat="tag in tagList track by $index" class="tag-default tag-pill">
                  <i class="ion-close-round" ng-click="removeTag(tag)"></i>
                  {{ tag }}
                </span>
              </div>
            </fieldset>

            <button class="btn btn-lg pull-xs-right btn-primary" type="button" ng-click="submitForm()">
              Publish Article
            </button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>
