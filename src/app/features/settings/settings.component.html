<div class="settings-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-6 offset-md-3 col-xs-12">
        <h1 class="text-xs-center">Your Settings</h1>

        <app-list-errors errors="errors"></app-list-errors>

        <form name="settingsForm" ng-submit="submitForm()">
          <fieldset ng-disabled="isSubmitting">
            <fieldset class="form-group">
              <input class="form-control" type="text" placeholder="URL of profile picture" ng-model="formData.image" />
            </fieldset>

            <fieldset class="form-group">
              <input
                class="form-control form-control-lg"
                type="text"
                placeholder="Username"
                ng-model="formData.username"
              />
            </fieldset>

            <fieldset class="form-group">
              <textarea
                class="form-control form-control-lg"
                rows="8"
                placeholder="Short bio about you"
                ng-model="formData.bio"
              ></textarea>
            </fieldset>

            <fieldset class="form-group">
              <input class="form-control form-control-lg" type="email" placeholder="Email" ng-model="formData.email" />
            </fieldset>

            <fieldset class="form-group">
              <input
                class="form-control form-control-lg"
                type="password"
                placeholder="New Password"
                ng-model="formData.password"
                required
              />
            </fieldset>

            <button class="btn btn-lg btn-primary pull-xs-right" type="submit">Update Settings</button>
          </fieldset>
        </form>

        <!-- Line break for logout button -->
        <hr />

        <button class="btn btn-outline-danger" ng-click="logout()">Or click here to logout.</button>
      </div>
    </div>
  </div>
</div>
