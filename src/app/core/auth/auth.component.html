<div class="auth-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-6 offset-md-3 col-xs-12">
        <h1 class="text-xs-center">{{ title }}</h1>
        <p class="text-xs-center">
          <a ng-if="authType === 'register'" ng-href="#!/login">Have an account?</a>
          <a ng-if="authType === 'login'" ng-href="#!/register">Need an account?</a>
        </p>
        <app-list-errors errors="errors"></app-list-errors>
        <form name="authForm" ng-submit="submitForm()">
          <fieldset ng-disabled="isSubmitting">
            <fieldset class="form-group" ng-if="authType === 'register'">
              <input
                ng-model="formData.username"
                placeholder="Username"
                class="form-control form-control-lg"
                type="text"
                required
              />
            </fieldset>
            <fieldset class="form-group">
              <input
                ng-model="formData.email"
                placeholder="Email"
                class="form-control form-control-lg"
                type="text"
                required
              />
            </fieldset>
            <fieldset class="form-group">
              <input
                ng-model="formData.password"
                placeholder="Password"
                class="form-control form-control-lg"
                type="password"
                required
              />
            </fieldset>
            <button class="btn btn-lg btn-primary pull-xs-right" ng-disabled="authForm.$invalid" type="submit">
              {{ title }}
            </button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>
