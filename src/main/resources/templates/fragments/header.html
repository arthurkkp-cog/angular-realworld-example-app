<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conduit</title>
    <link href="//code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css" rel="stylesheet" type="text/css">
    <link href="//fonts.googleapis.com/css?family=Titillium+Web:700|Source+Serif+Pro:400,700|Merriweather+Sans:400,700|Source+Sans+Pro:400,300,600,700,300italic,400italic,600italic,700italic" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="//demo.productionready.io/main.css">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-light">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">conduit</a>

        <!-- Show this for logged out users -->
        <ul th:if="${currentUser == null}" class="nav navbar-nav pull-xs-right">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/}">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/login}">Sign in</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/register}">Sign up</a>
            </li>
        </ul>

        <!-- Show this for logged in users -->
        <ul th:if="${currentUser != null}" class="nav navbar-nav pull-xs-right">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/}">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/editor}">
                    <i class="ion-compose"></i>&nbsp;New Article
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/settings}">
                    <i class="ion-gear-a"></i>&nbsp;Settings
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/profile/{username}(username=${currentUser.username})}">
                    <img th:if="${currentUser.image != null}" th:src="${currentUser.image}" class="user-pic" />
                    <span th:text="${currentUser.username}"></span>
                </a>
            </li>
        </ul>
    </div>
</nav>
</body>
</html>
